const W=3508,H=2480,S=W/2296;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const img=new Image();let ready=false;
function draw(){
 if(!ready)return;
 ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
 ctx.drawImage(img,0,0,W,H);
 // erase old text (template coordinates)
 const er=[[700,708,1725,800],[1295,925,1710,998],[1540,1000,1710,1068]];
 ctx.fillStyle='#fff';
 er.forEach(([a,b,c,d])=>ctx.fillRect(a*S,b*S,(c-a)*S,(d-b)*S));
 ctx.fillStyle='#000';ctx.direction='rtl';ctx.textBaseline='middle';
 const fam="AdvBold, Tajawal, Tahoma, sans-serif";
 // course – centered, shrinks if too long
 let fs=58*S,t=document.getElementById('course').value.trim();
 ctx.textAlign='center';ctx.font='700 '+fs+'px '+fam;
 const maxW=1250*S;let w=ctx.measureText(t).width;
 if(w>maxW){fs*=maxW/w;ctx.font='700 '+fs+'px '+fam}
 ctx.fillText(t,1196*S,756*S);
 // trainer & duration – right aligned at x=1688
 ctx.textAlign='right';ctx.font='700 '+(46*S)+'px '+fam;
 ctx.fillText(document.getElementById('trainer').value.trim(),1688*S,961*S);
 ctx.fillText(document.getElementById('dur').value.trim(),1688*S,1033*S);
}
img.onload=()=>{ready=true;(document.fonts?Promise.all([document.fonts.load('700 40px AdvBold','ابج'),document.fonts.load('700 40px Tajawal','ابج')]):Promise.resolve()).catch(()=>{}).then(draw)};
img.src=SRC;
['course','trainer','dur'].forEach(i=>document.getElementById(i).addEventListener('input',draw));
if(document.fonts)document.fonts.ready.then(draw);

 draw();
 cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);
 a.download='شهادة-حضور.png';document.body.appendChild(a);a.click();a.remove();
 document.getElementById('st').textContent='تم التصدير بحجم '+W+'×'+H;},'image/png');
};
